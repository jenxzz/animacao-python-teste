<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para você ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at 50% 45%, #35123f 0%, #170b1f 48%, #08050d 100%);
      color: white;
    }

    .stars, .hearts { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      width: 3px; height: 3px;
      background: #fff2b2;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff2b2;
      animation: twinkle var(--d) ease-in-out infinite;
      opacity: .5;
    }
    @keyframes twinkle {
      0%,100% { transform: scale(.5); opacity: .25; }
      50% { transform: scale(1.7); opacity: 1; }
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .card {
      width: min(650px, 92vw);
      padding: 42px 30px 34px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(20, 8, 28, .48);
      box-shadow: 0 25px 80px rgba(0,0,0,.45), inset 0 0 40px rgba(255,79,135,.05);
      backdrop-filter: blur(8px);
    }

    .heart {
      width: 115px;
      height: 105px;
      margin: 0 auto 26px;
      position: relative;
      transform: rotate(-45deg);
      background: #ff4f87;
      filter: drop-shadow(0 0 18px rgba(255,79,135,.7));
      animation: pulse 1.45s ease-in-out infinite;
      cursor: pointer;
    }
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 115px; height: 105px;
      border-radius: 50%;
      background: #ff4f87;
    }
    .heart::before { top: -57px; left: 0; }
    .heart::after { left: 57px; top: 0; }

    @keyframes pulse {
      0%,100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.09); }
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 52px);
      font-weight: 600;
      letter-spacing: .5px;
    }
    .subtitle {
      color: #f8dce8;
      font-size: 16px;
      margin-bottom: 26px;
      opacity: .85;
    }

    .message {
      min-height: 110px;
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.65;
      color: #fff8fb;
    }

    button {
      border: 0;
      padding: 13px 23px;
      border-radius: 999px;
      background: #ff4f87;
      color: white;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255,79,135,.25);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,79,135,.4); }

    .floating {
      position: absolute;
      font-size: 18px;
      animation: floatUp 4s linear forwards;
      opacity: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(30px) scale(.7); opacity: 0; }
      15% { opacity: .8; }
      100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }

    .hint { margin-top: 18px; font-size: 12px; color: #d8bccc; opacity: .7; }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>

  <main class="wrap">
    <section class="card">
      <div class="heart" id="heart" aria-label="coração"></div>
      <h1>Para você ❤️</h1>
      <div class="subtitle">uma coisinha que eu fiz especialmente pra você</div>
      <div class="message" id="message"></div>
      <button id="next">✨ Tenho mais uma coisa pra dizer</button>
      <div class="hint">Papoi :)</div>
    </section>
  </main>

  <script>
    const stars = document.getElementById("stars");
    for (let i = 0; i < 90; i++) {
      const s = document.createElement("span");
      s.className = "star";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.setProperty("--d", (1.5 + Math.random() * 3) + "s");
      s.style.animationDelay = (-Math.random() * 4) + "s";
      stars.appendChild(s);
    }

    const messages = [
      "Eu queria fazer uma coisa simples, mas que tivesse um pedacinho de mim.",
      "Então fiz isso aqui só pra você.",
      "Talvez seja só uma tela cheia de estrelinhas e um coração...",
      "mas eu espero que, quando você olhar pra isso, lembre de mim. ❤️"
    ];

    let index = 0;
    const message = document.getElementById("message");
    const button = document.getElementById("next");

    function typeText(text) {
      message.textContent = "";
      let i = 0;
      const timer = setInterval(() => {
        message.textContent += text[i++];
        if (i >= text.length) clearInterval(timer);
      }, 32);
    }

    typeText(messages[0]);

    button.addEventListener("click", () => {
      index++;
      if (index < messages.length) {
        typeText(messages[index]);
        if (index === messages.length - 1) button.textContent = "💗 De novo";
      } else {
        index = 0;
        typeText(messages[0]);
        button.textContent = "✨ Tenho mais uma coisa pra dizer";
      }
      burst();
    });

    document.getElementById("heart").addEventListener("click", burst);

    function burst() {
      for (let i = 0; i < 12; i++) {
        const h = document.createElement("span");
        h.className = "floating";
        h.textContent = Math.random() > .25 ? "♥" : "✦";
        h.style.left = (45 + Math.random() * 10) + "%";
        h.style.top = (48 + Math.random() * 8) + "%";
        h.style.animationDelay = (Math.random() * .35) + "s";
        document.getElementById("hearts").appendChild(h);
        setTimeout(() => h.remove(), 4300);
      }
    }
  </script>
</body>
</html>
